
name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Long Paths
        run: git config --system core.longpaths true

      - name: Install Build Tools
        run: choco install cmake ninja innosetup -y --no-progress

      - name: Fetch Latest Aseprite Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "Aseprite-Builder"
          }

          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/aseprite/aseprite/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match "Source\.zip$" } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Aseprite source ZIP not found"
          }

          "ASE_VER=$($release.tag_name)" >> $env:GITHUB_ENV
          "SOURCE_URL=$($asset.browser_download_url)" >> $env:GITHUB_ENV

          Write-Host "Aseprite version: $($release.tag_name)"

      - name: Download and Extract Source
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest `
            -Uri $env:SOURCE_URL `
            -OutFile "aseprite_src.zip"

          Expand-Archive "aseprite_src.zip" "temp_ext" -Force

          $root = Get-ChildItem "temp_ext" `
            -Filter "CMakeLists.txt" -Recurse |
            Where-Object {
              Test-Path (Join-Path $_.DirectoryName "src")
            } |
            Select-Object -First 1

          if (-not $root) {
            throw "Aseprite source root not found"
          }

          New-Item -ItemType Directory -Path "aseprite" -Force | Out-Null

          Get-ChildItem $root.DirectoryName -Force |
            Move-Item -Destination "aseprite" -Force

          if (-not (Test-Path "aseprite/CMakeLists.txt")) {
            throw "Invalid Aseprite source"
          }

      - name: Download and Extract Skia m124
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "Aseprite-Builder"
          }

          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/aseprite/skia/releases/tags/m124-08a5439a6b"

          $asset = $release.assets |
            Where-Object {
              $_.name -eq "Skia-Windows-Release-x64.zip"
            } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Skia m124 Windows x64 package not found"
          }

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile "skia.zip"

          New-Item -ItemType Directory -Path "skia" -Force | Out-Null
          Expand-Archive "skia.zip" "skia" -Force

          $lib = "skia/out/Release-x64/skia.lib"

          if (-not (Test-Path $lib)) {
            Get-ChildItem "skia" -Depth 3 |
              Select-Object FullName
            throw "Skia library missing or directory layout incorrect"
          }

          Write-Host "Skia m124 library verified"

      - name: Check Skia Dependencies
        run: |
          $ErrorActionPreference = "Stop"

          $skia = Join-Path $env:GITHUB_WORKSPACE "skia"

          $paths = @(
            "include"
            "third_party/externals/libjpeg-turbo"
            "third_party/externals/icu/flutter/icudtl.dat"
          )

          foreach ($path in $paths) {
            $full = Join-Path $skia $path

            if (Test-Path $full) {
              Write-Host "[OK] $path"
            } else {
              Write-Warning "[MISSING] $path"
            }
          }

      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Run CMake Configuration
        run: |
          $ErrorActionPreference = "Stop"

          $src = Join-Path $env:GITHUB_WORKSPACE "aseprite"
          $skia = Join-Path $env:GITHUB_WORKSPACE "skia"
          $build = Join-Path $env:GITHUB_WORKSPACE "build"

          New-Item -ItemType Directory -Path $build -Force | Out-Null

          cmake -S "$src" -B "$build" -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$skia" `
            -DSKIA_LIBRARY_DIR="$skia/out/Release-x64" `
            -DSKIA_LIBRARY="$skia/out/Release-x64/skia.lib" `
            -DENABLE_UPDATER=OFF `
            -DENABLE_TESTS=OFF

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Compile with Ninja
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "build"
          $cpu = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          $jobs = [math]::Min($cpu, 8)

          cmake --build "$build" --target aseprite --parallel $jobs

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed"
          }

      - name: Verify Executable
        run: |
          $exe = "build/bin/aseprite.exe"

          if (-not (Test-Path $exe)) {
            throw "aseprite.exe was not generated"
          }

          Write-Host "Aseprite executable compiled successfully"

      - name: Collect Dependencies
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE "build/bin"
          $ssl = "C:/Program Files/OpenSSL/bin"

          foreach ($dll in @(
            "libcrypto-3-x64.dll"
            "libssl-3-x64.dll"
          )) {
            $src = Join-Path $ssl $dll
            if (Test-Path $src) {
              Copy-Item $src $bin -Force
            }
          }

      - name: Package Installer
        run: |
          $ErrorActionPreference = "Stop"

          $bin = Join-Path $env:GITHUB_WORKSPACE "build/bin"
          $output = Join-Path $env:GITHUB_WORKSPACE "installer"

          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $iss = @"
          [Setup]
          AppName=Aseprite
          AppVersion=$env:ASE_VER
          DefaultDirName={autopf}\Aseprite
          DefaultGroupName=Aseprite
          OutputBaseFilename=aseprite-setup
          OutputDir=$output
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "$bin\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Aseprite"; Filename: "{app}\aseprite.exe"
          "@

          $iss | Out-File "aseprite.iss" -Encoding utf8

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "aseprite.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Installer packaging failed"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Installer
          path: installer/*.exe
          if-no-files-found: error
          retention-days: 7
